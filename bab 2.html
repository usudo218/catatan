<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi & Uji Pemahaman Bab 2 - Jenis dan Sumber Data</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0 0 8px 0;
            font-size: 1.8rem;
        }

        .header p {
            color: #64748b;
            margin: 0;
            font-size: 0.95rem;
        }

        /* Styling Materi */
        .material-section {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 40px;
        }

        .material-section h2 {
            color: var(--primary-color);
            font-size: 1.4rem;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
            margin-top: 0;
        }

        .material-section h3 {
            color: #34495e;
            font-size: 1.1rem;
            margin-top: 20px;
        }

        .material-section p, .material-section li {
            line-height: 1.6;
            color: #475569;
        }

        table.material-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 0.95rem;
        }

        table.material-table th, table.material-table td {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            text-align: left;
        }

        table.material-table th {
            background-color: #e2e8f0;
            color: var(--primary-color);
        }

        /* Area Form Ujian */
        .exam-section {
            border-top: 3px dashed var(--border-color);
            padding-top: 30px;
        }

        .identity-card {
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--secondary-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .identity-card h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #475569;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .form-control:disabled {
            background-color: #e2e8f0;
            color: #64748b;
            cursor: not-allowed;
            font-weight: bold;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 5px;
            font-weight: bold;
        }

        .badge-unlocked { background: #fef3c7; color: #92400e; }
        .badge-locked { background: #dcfce7; color: #166534; }

        .question-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .question-title {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.05rem;
            line-height: 1.5;
        }

        textarea.essay-input {
            width: 100%;
            min-height: 100px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: vertical;
            font-family: inherit;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

            gap: 15px;
            justify-content: flex-end;
